services:
  - type: web
    name: michael-hawi-portfolio
    runtime: static
    plan: free
    buildCommand: echo "Static portfolio ready"
    staticPublishPath: ./
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
